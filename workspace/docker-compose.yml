services:
  jupyterhub:
    image: quay.io/jupyterhub/jupyterhub
    container_name: jupyterhub

    ports:
      - "8000:8000"

    volumes:
      - type: bind
        source: /app/jupyterhub/home
        target: /home

      - type: bind
        source: /app/jupyterhub/data
        target: /srv/jupyterhub
        
      - type: bind
        source: /app/models
        target: /models


    command: jupyterhub -f /srv/jupyterhub/jupyterhub_config.py

    restart: unless-stopped

    environment:
      - NVIDIA_VISIBLE_DEVICES=3
      - HF_HOME=/models/huggingface
      - TRANSFORMERS_CACHE=/models/huggingface
      - HF_HUB_CACHE=/models/huggingface

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["3"]
              capabilities: [gpu]
