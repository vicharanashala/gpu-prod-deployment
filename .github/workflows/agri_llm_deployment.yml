name: AgriLLM Model Deployment

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model to deploy"
        required: true
        type: choice
        options:
          - dhenu
          - agri_param

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug - List Files
        run: ls -R

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image name
        id: image
        run: |
          if [ "${{ inputs.model }}" = "dhenu" ]; then
            echo "name=dhenu"                     >> $GITHUB_OUTPUT
            echo "dockerfile=Dockerfile.dhenu"    >> $GITHUB_OUTPUT
          else
            echo "name=agri-param"                >> $GITHUB_OUTPUT
            echo "dockerfile=Dockerfile.agri_param" >> $GITHUB_OUTPUT
          fi

      - name: Build & Push Image
        uses: docker/build-push-action@v5
        with:
          context: ./agri_llm_open_source/docker
          file: ./agri_llm_open_source/docker/${{ steps.image.outputs.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.image.outputs.name }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.image.outputs.name }}:${{ github.sha }}
