name: AgriLLM Model Deployment

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model to deploy"
        required: true
        type: choice
        options:
          - dhenu
          - agri_param
      environment:
        description: "Target environment"
        required: true
        type: choice
        default: production
        options:
          - production
          - staging

permissions:
  contents: read
  packages: write
  id-token: write

# ── Per-model config resolved via env ──────────────────────────────────────
env:
  DOCKER_CONTEXT: agri_llm_open_source/docker
  # dhenu config
  DHENU_DOCKERFILE:    Dockerfile.dhenu
  DHENU_IMAGE:         agri-llm/dhenu
  DHENU_CONTAINER:     dhenu_vllm
  DHENU_SERVICE:       dhenu
  # agri_param config
  PARAM_DOCKERFILE:    Dockerfile.agri_param
  PARAM_IMAGE:         agri-llm/agri_param
  PARAM_CONTAINER:     agri_param_vllm
  PARAM_SERVICE:       agri_param

jobs:

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 1 — Resolve model-specific variables
  # ─────────────────────────────────────────────────────────────────────────
  resolve-config:
    name: Resolve Config for '${{ inputs.model }}'
    runs-on: ubuntu-latest
    outputs:
      dockerfile:  ${{ steps.cfg.outputs.dockerfile }}
      image:       ${{ steps.cfg.outputs.image }}
      image_full:  ${{ steps.cfg.outputs.image_full }}
      container:   ${{ steps.cfg.outputs.container }}
      service:     ${{ steps.cfg.outputs.service }}

    steps:
      - name: Set model config
        id: cfg
        run: |
          if [ "${{ inputs.model }}" = "dhenu" ]; then
            echo "dockerfile=${{ env.DHENU_DOCKERFILE }}"  >> $GITHUB_OUTPUT
            echo "image=${{ env.DHENU_IMAGE }}"            >> $GITHUB_OUTPUT
            echo "image_full=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DHENU_IMAGE }}"  >> $GITHUB_OUTPUT
            echo "container=${{ env.DHENU_CONTAINER }}"    >> $GITHUB_OUTPUT
            echo "service=${{ env.DHENU_SERVICE }}"        >> $GITHUB_OUTPUT
          else
            echo "dockerfile=${{ env.PARAM_DOCKERFILE }}"  >> $GITHUB_OUTPUT
            echo "image=${{ env.PARAM_IMAGE }}"            >> $GITHUB_OUTPUT
            echo "image_full=${{ secrets.DOCKERHUB_USERNAME }}/${{ env.PARAM_IMAGE }}"  >> $GITHUB_OUTPUT
            echo "container=${{ env.PARAM_CONTAINER }}"    >> $GITHUB_OUTPUT
            echo "service=${{ env.PARAM_SERVICE }}"        >> $GITHUB_OUTPUT
          fi

      - name: Summary
        run: |
          echo "### 🚀 Deployment Config" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |"          >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|"          >> $GITHUB_STEP_SUMMARY
          echo "| Model       | \`${{ inputs.model }}\`               |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | \`${{ inputs.environment }}\`          |" >> $GITHUB_STEP_SUMMARY
          echo "| Dockerfile  | \`${{ steps.cfg.outputs.dockerfile }}\`|" >> $GITHUB_STEP_SUMMARY
          echo "| Image       | \`${{ steps.cfg.outputs.image_full }}\`|" >> $GITHUB_STEP_SUMMARY
          echo "| Container   | \`${{ steps.cfg.outputs.container }}\` |" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 2 — Build & Push Docker image to DockerHub
  # ─────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push — ${{ inputs.model }}
    runs-on: ubuntu-latest
    needs: resolve-config

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Image
        uses: docker/build-push-action@v5
        with:
          context:    ${{ env.DOCKER_CONTEXT }}
          file:       ${{ env.DOCKER_CONTEXT }}/${{ needs.resolve-config.outputs.dockerfile }}
          push:       true
          platforms:  linux/amd64
          tags: |
            ${{ needs.resolve-config.outputs.image_full }}:latest
            ${{ needs.resolve-config.outputs.image_full }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ needs.resolve-config.outputs.image_full }}:buildcache
          cache-to:   type=registry,ref=${{ needs.resolve-config.outputs.image_full }}:buildcache,mode=max

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 3 — Deploy to GPU server via SSH
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy — ${{ inputs.model }} → ${{ inputs.environment }}
    runs-on: ubuntu-latest
    needs: [resolve-config, build-and-push]
    environment: ${{ inputs.environment }}

    steps:
      - name: SSH & Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:        ${{ secrets.SSH_HOST }}
          username:    ${{ secrets.SSH_USER }}
          key:         ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            COMPOSE_DIR="/home/aic_u2/Shubhankar/Pop/github_agri_llm/ajrasakha/testing_agri_llm/docker"
            SERVICE="${{ needs.resolve-config.outputs.service }}"
            IMAGE="${{ needs.resolve-config.outputs.image_full }}"

            echo "📦 Pulling latest image: $IMAGE"
            docker pull "$IMAGE:latest"

            echo "🔄 Restarting service: $SERVICE"
            cd "$COMPOSE_DIR"
            docker compose up -d --no-deps --pull always "$SERVICE"

            echo "✅ Checking health..."
            sleep 20
            docker compose ps "$SERVICE"

      - name: Deployment summary
        if: always()
        run: |
          echo "### Deployment Result" >> $GITHUB_STEP_SUMMARY
          echo "- **Model:** \`${{ inputs.model }}\`"              >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`${{ needs.resolve-config.outputs.image_full }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** \`${{ inputs.environment }}\`"  >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** @${{ github.actor }}"          >> $GITHUB_STEP_SUMMARY
