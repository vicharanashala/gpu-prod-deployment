name: Build and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Service to build & push"
        required: true
        type: choice
        options:
          - effnet
          - search_api

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug - List Files
        run: ls -R

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image metadata
        id: meta
        run: |
          if [ "${{ inputs.service }}" = "effnet" ]; then
            echo "name=effnet"                                  >> $GITHUB_OUTPUT
            echo "context=./vision_model_containerzation"      >> $GITHUB_OUTPUT
            echo "dockerfile=./vision_model_containerzation/Dockerfile" >> $GITHUB_OUTPUT
          elif [ "${{ inputs.service }}" = "search_api" ]; then
            echo "name=search-api"                             >> $GITHUB_OUTPUT
            echo "context=./search_api"                        >> $GITHUB_OUTPUT
            echo "dockerfile=./search_api/Dockerfile"          >> $GITHUB_OUTPUT
          fi

      - name: Build & Push Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ steps.meta.outputs.context }}
          file: ${{ steps.meta.outputs.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.meta.outputs.name }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ steps.meta.outputs.name }}:${{ github.sha }}
